project_id = "mzansi-voter"

[db]
major_version = 17

[db.migrations]
enabled = true

[db.seed]
enabled = false

[auth]
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://127.0.0.1:3000/auth/callback"]
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = false

[auth.hook.before_user_created]
enabled = true
uri = "pg-functions://postgres/public/hook_restrict_theodo_signup"

[functions.product-preview]
verify_jwt = true

[functions.product-availability]
verify_jwt = true
